# Astra 交付模型 v1.0 自建 base workflow（含 slot 扩展点）
# 六阶段：Plan → Design → Build → Test → Deploy → Maintain
# 评审分层：PO/Arch/Prog/Release 四角色 gate
schema_version: "1.0"
workflow:
  id: "astra-delivery"
  name: "Astra Delivery Model v1.0"
  version: "0.1.0"
  author: "Astra Flow"
  description: "Six-phase delivery with four-role review gates"

requires:
  speckit_version: ">=0.8.5"
  integrations:
    any: [copilot, claude, gemini, opencode]

inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"

steps:
  # ---- 阶段 1 · Plan ----
  - id: intake
    type: command
    command: speckit.intake
    input:
      args: "{{ inputs.spec }}"
  - id: specify
    type: command
    command: speckit.specify
    input:
      args: "{{ inputs.spec }}"
  - id: gate-po-spec
    type: gate
    message: "[PO] 评审 spec.md：需求明确 + AC 可验证？"
    options: [approve, reject]
    on_reject: retry
  # ---- 阶段 2 · Design ----
  - id: plan
    type: command
    command: speckit.plan
    input:
      args: "{{ inputs.spec }}"
  - id: gate-arch-plan
    type: gate
    message: "[Arch] 评审 plan.md：方案可行 + 架构合规？"
    options: [approve, reject]
    on_reject: retry
  - id: tasks
    type: command
    command: speckit.tasks
    input:
      args: "{{ inputs.spec }}"
  # ---- 阶段 3 · Build ----
  - id: implement
    type: command
    command: speckit.implement
    input:
      args: "{{ inputs.spec }}"
  - id: post-implement
    type: slot
    name: "Post-implementation review (Prog 互审)"
  # ---- 阶段 4 · Test ----
  - id: test
    type: command
    command: speckit.test
    input:
      args: "{{ inputs.spec }}"
  - id: gate-test-pass
    type: gate
    message: "[QA] test.md 测试通过率达标？"
    options: [approve, reject]
    on_reject: retry
  # ---- 阶段 5 · Deploy ----
  - id: converge
    type: command
    command: speckit.converge
    input:
      args: "{{ inputs.spec }}"
  - id: gate-release
    type: gate
    message: "[Release] 门禁通过 + 可回滚 + 影响已评估？"
    options: [approve, reject]
    on_reject: abort
  # ---- 阶段 6 · Maintain（slot，治理循环挂载点）----
  - id: maintain
    type: slot
    name: "Maintain governance loop"
